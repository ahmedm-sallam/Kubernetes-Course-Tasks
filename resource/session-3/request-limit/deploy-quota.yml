apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: quota
spec:
  replicas: 6
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80