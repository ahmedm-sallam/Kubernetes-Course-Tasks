apiVersion: v1
kind: Namespace
metadata:
  name: affinity-example
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  namespace: affinity-example
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80

      affinity:
        # Node Affinity - attract to nodes
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: app
                    operator: In
                    values: [web]

          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: disktype
                    operator: In
                    values: [ssd]

        # Pod Anti-Affinity - spread replicas apart
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: web
              topologyKey: kubernetes.io/hostname

# kubectl label nodes minikube-m02 app=web
# kubectl label nodes minikube-m03 app=web
# kubectl label nodes minikube app=web
# ----------------------------
# kubectl label nodes minikube-m03 disktype=ssd
